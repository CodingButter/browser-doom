name: Update progress badge

on:
  issues:
    types: [opened, closed, reopened, deleted, transferred]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count issues
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOSED=$(gh issue list --state closed --limit 1000 --json number --jq 'length')
          OPEN=$(gh issue list --state open --limit 1000 --json number --jq 'length')
          TOTAL=$((CLOSED + OPEN))
          if [ "$TOTAL" -eq 0 ]; then
            PCT=0
          else
            PCT=$((CLOSED * 100 / TOTAL))
          fi
          echo "pct=$PCT"       >> "$GITHUB_OUTPUT"
          echo "closed=$CLOSED" >> "$GITHUB_OUTPUT"
          echo "open=$OPEN"     >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"   >> "$GITHUB_OUTPUT"

      - name: Rewrite progress section in README
        env:
          PCT:    ${{ steps.count.outputs.pct }}
          CLOSED: ${{ steps.count.outputs.closed }}
          TOTAL:  ${{ steps.count.outputs.total }}
        run: |
          python3 <<'PY'
          import os, re, sys, pathlib
          pct, closed, total = os.environ['PCT'], os.environ['CLOSED'], os.environ['TOTAL']
          path = pathlib.Path('README.md')
          src = path.read_text()
          block = (
              f"<!-- progress:start -->\n"
              f"**Port progress:** {closed} / {total} issues closed ({pct}%)\n\n"
              f"![Progress](https://progress-bar.xyz/{pct}/?title=ported&width=400)\n"
              f"<!-- progress:end -->"
          )
          new, count = re.subn(
              r"<!-- progress:start -->.*?<!-- progress:end -->",
              block,
              src,
              flags=re.DOTALL,
          )
          if count == 0:
              print("ERROR: progress markers not found in README", file=sys.stderr)
              sys.exit(1)
          if new == src:
              print(f"No change needed (already at {pct}%).")
          else:
              path.write_text(new)
              print(f"README updated to {pct}%.")
          PY

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update progress badge"
          git push
